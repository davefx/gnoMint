title: gnoMint
description: >-
  A graphical Certification Authority manager for GTK 4, GnuTLS, and SQLite.
  Bootstrap CAs, sign CSRs, issue and revoke certificates, all from a
  desktop app — or driven from the readline CLI.
# Pages serves the repo at /<repo>/ with the GitHub case preserved.
# This repo is davefx/gnoMint (capital M), so baseurl is /gnoMint.
baseurl: "/gnoMint"
url: "https://davefx.github.io"

# Shown in the sidebar "Latest release" quick link; bump on each release.
latest_release: '1.6.8 "Tempered Anvil" (2026-06-20)'
# Bare version, consumed by the SoftwareApplication structured data.
software_version: '1.6.8'

remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap

show_downloads: false
github:
  is_project_page: true
  repository_url: https://github.com/davefx/gnoMint
  repository_nwo: davefx/gnoMint
  owner_name: David Marín Carreño
  owner_url: https://github.com/davefx
  project_title: gnoMint
  project_tagline: A GTK 4 Certification Authority manager

header_pages:
  - features.md
  - install.md
  - manual.md
  - tutorial.md
  - releases.md

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
